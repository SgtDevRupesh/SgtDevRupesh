name: Metrics
on:
  # Refresh every 3 hours
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["scripts/**", ".github/workflows/main.yml"]
jobs:
  cockpit-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render MFD cards
        run: node scripts/generate.mjs
        env:
          # PAT with repo + read:user so private-repo languages/contributions are counted.
          GITHUB_TOKEN: ${{ secrets.GHUB_TOKEN }}
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git diff --cached --quiet || git commit -m "Update cockpit metrics - [Skip GitHub Action]"
          git push
