name: Metrics
on:
  # Refresh every 3 hours
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["scripts/**", "assets/**", ".github/workflows/main.yml"]
# Queue overlapping runs (schedule + push) instead of letting them race on the push.
concurrency:
  group: profile-metrics
  cancel-in-progress: false
jobs:
  profile-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Render profile cards
        run: node scripts/generate.mjs
        env:
          # Classic PAT with `repo` + `read:user` (+ `read:org`); authorize it for SSO orgs so work repos are visible.
          GITHUB_TOKEN: ${{ secrets.GHUB_TOKEN }}
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A metrics
          git diff --cached --quiet || git commit -m "Update profile metrics - [Skip GitHub Action]"
          # main may have moved since checkout (re-runs, other pushes); replay on top, keeping these fresh cards.
          git pull --rebase -X theirs origin main
          git push
